{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ with .Content }}<div>{{ . }}</div>{{ end }}
<ul class="post-list">
  {{ range .Pages }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Date }}<span class="post-date">{{ .Format "2006-01-02" }}</span>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
