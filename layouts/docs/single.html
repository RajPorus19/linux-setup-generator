{{ define "main" }}
<style>
  .docs-layout { display: grid; grid-template-columns: 220px 1fr; gap: 2.5rem; align-items: start; }
  @media (max-width: 680px) { .docs-layout { grid-template-columns: 1fr; } .docs-sidebar { display: none; } }

  .docs-sidebar { position: sticky; top: 1.5rem; }
  .docs-sidebar-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #999; margin: 0 0 0.6rem 0.75rem; }
  .docs-nav { list-style: none; padding: 0; margin: 0; }
  .docs-nav li a { display: block; padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.875rem; color: #444; text-decoration: none; transition: background 0.12s, color 0.12s; }
  .docs-nav li a:hover { background: #f3f4f6; color: #111; }
  .docs-nav li a.active { background: #f0fdf4; color: #16a34a; font-weight: 600; }

  /* Doc content typography */
  .doc-body h1 { margin-top: 0; font-size: 1.8rem; }
  .doc-body h2 { font-size: 1.2rem; margin: 2rem 0 0.6rem; padding-bottom: 0.4rem; border-bottom: 1px solid #e5e7eb; }
  .doc-body h3 { font-size: 1rem; margin: 1.5rem 0 0.4rem; }
  .doc-body p { margin: 0 0 0.9rem; line-height: 1.7; color: #333; }
  .doc-body ul, .doc-body ol { margin: 0 0 0.9rem 1.25rem; line-height: 1.7; color: #333; }
  .doc-body li { margin-bottom: 0.3rem; }
  .doc-body a { color: #0066cc; }
  .doc-body a:hover { text-decoration: underline; }
  .doc-body strong { color: #111; }

  /* Code */
  .doc-body code { background: #f3f4f6; border-radius: 4px; padding: 0.15rem 0.4rem; font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace; font-size: 0.82em; color: #d63384; }
  .doc-body pre { background: #1e1e1e; color: #d4d4d4; border-radius: 8px; padding: 1.1rem 1.25rem; overflow-x: auto; margin: 0.5rem 0 1.2rem; }
  .doc-body pre code { background: none; padding: 0; color: inherit; font-size: 0.85rem; line-height: 1.65; }

  /* Tables */
  .doc-body table { width: 100%; border-collapse: collapse; margin: 0.5rem 0 1.25rem; font-size: 0.875rem; }
  .doc-body th { text-align: left; padding: 0.5rem 0.75rem; background: #f8f9fa; border-bottom: 2px solid #e0e0e0; font-weight: 600; color: #333; }
  .doc-body td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  .doc-body tr:last-child td { border-bottom: none; }

  /* Blockquote / callout */
  .doc-body blockquote { margin: 0 0 1rem; padding: 0.75rem 1rem 0.75rem 1.1rem; background: #fffbeb; border-left: 3px solid #f59e0b; border-radius: 0 6px 6px 0; }
  .doc-body blockquote p { margin: 0; color: #78350f; font-size: 0.9rem; }

  .doc-breadcrumb { font-size: 0.82rem; color: #999; margin-bottom: 1.25rem; }
  .doc-breadcrumb a { color: #999; text-decoration: none; }
  .doc-breadcrumb a:hover { color: #0066cc; }
</style>

{{ $section := .Site.GetPage "/docs" }}

<div class="docs-layout">
  <!-- Sidebar -->
  <aside class="docs-sidebar">
    <p class="docs-sidebar-title">Documentation</p>
    <ul class="docs-nav">
      {{ range $section.Pages }}
      <li>
        <a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} class="active"{{ end }}>{{ .Title }}</a>
      </li>
      {{ end }}
    </ul>
  </aside>

  <!-- Content -->
  <article class="doc-body">
    <div class="doc-breadcrumb">
      <a href="/docs/">Docs</a> › {{ .Title }}
    </div>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </article>
</div>
{{ end }}
