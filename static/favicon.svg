<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#22c55e"/>
  <!-- Penguin body -->
  <ellipse cx="32" cy="38" rx="14" ry="16" fill="#1a1a2e"/>
  <!-- White belly -->
  <ellipse cx="32" cy="40" rx="9" ry="12" fill="#f8f9fa"/>
  <!-- Head -->
  <circle cx="32" cy="22" r="11" fill="#1a1a2e"/>
  <!-- Eyes -->
  <circle cx="28" cy="20" r="2.5" fill="#f8f9fa"/>
  <circle cx="36" cy="20" r="2.5" fill="#f8f9fa"/>
  <circle cx="28.8" cy="20" r="1.2" fill="#1a1a2e"/>
  <circle cx="36.8" cy="20" r="1.2" fill="#1a1a2e"/>
  <!-- Beak -->
  <ellipse cx="32" cy="24.5" rx="3" ry="2" fill="#f59e0b"/>
  <!-- Feet -->
  <ellipse cx="25" cy="54" rx="5" ry="2.5" fill="#f59e0b"/>
  <ellipse cx="39" cy="54" rx="5" ry="2.5" fill="#f59e0b"/>
  <!-- Wings -->
  <ellipse cx="17" cy="38" rx="4" ry="9" fill="#1a1a2e" transform="rotate(-15 17 38)"/>
  <ellipse cx="47" cy="38" rx="4" ry="9" fill="#1a1a2e" transform="rotate(15 47 38)"/>
</svg>
