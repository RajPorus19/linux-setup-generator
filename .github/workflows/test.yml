name: Test install scripts

on:
  push:
    branches: [develop]
    paths:
      - 'content/programs/**'
      - 'content/distros/**'
      - 'content/dependencies/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'content/programs/**'
      - 'content/distros/**'
      - 'content/dependencies/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        distro: [alpine, arch, debian, fedora, opensuse, ubuntu, void]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t lsg-test:${{ matrix.distro }} -f tests/docker/Dockerfile.${{ matrix.distro }} . 2>&1 | tee docker-build.log
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV
        continue-on-error: true

      - name: Check build result
        run: |
          if [ "$BUILD_EXIT_CODE" != "0" ]; then
            echo "## ❌ Docker build failed for ${{ matrix.distro }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 docker-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run tests
        run: python3 tests/runner.py --distro ${{ matrix.distro }}

      - name: Generate HTML report
        if: always()
        run: |
          if [ -f report.json ]; then
            python3 tests/report.py report.json --html -o report-${{ matrix.distro }}.html
          else
            echo "⚠️  No report.json — Docker build or test runner failed"
          fi

      - name: Generate Markdown summary
        if: always()
        run: |
          if [ -f report.json ]; then
            python3 tests/report.py report.json --markdown >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️  ${{ matrix.distro }} — build or runner failed, no report generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload report (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.distro }}
          path: |
            report.json
            report-${{ matrix.distro }}.html
            docker-build.log
