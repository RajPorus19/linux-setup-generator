{"categories":["display-server"],"description":"X.Org display server","git_repo":"https://gitlab.freedesktop.org/xorg","license":"MIT","name":"Xorg","package_names":{"arch":"xorg","default":"xorg","ubuntu":"xorg","void":"xorg"},"slug":"xorg","website":"https://www.x.org"},{"categories":["media-downloader"],"description":"Download videos from YouTube and other sites","git_repo":"https://github.com/ytdl-org/youtube-dl","license":"Unlicense","name":"youtube-dl","package_names":{"arch":"youtube-dl","default":"youtube-dl","ubuntu":"youtube-dl","void":"youtube-dl"},"slug":"youtube-dl","website":"https://youtube-dl.org"},{"categories":["media","tui"],"description":"Fuzzy finder for YouTube using fzf","git_repo":"https://github.com/pystardust/ytfzf","license":"GPL-3.0","name":"ytfzf","package_names":{"arch":"ytfzf","default":"ytfzf","ubuntu":null,"void":null},"slug":"ytfzf","website":null},{"categories":["document-viewer"],"description":"Minimalistic document viewer","git_repo":"https://github.com/pwmt/zathura","license":"Zlib","name":"zathura","package_names":{"arch":"zathura","default":"zathura","ubuntu":"zathura","void":"zathura"},"slug":"zathura","website":"https://pwmt.org/projects/zathura/"},{"categories":["shell"],"description":"Extended Bourne shell with many improvements","git_repo":"https://sourceforge.net/p/zsh/code","license":"MIT-like","name":"zsh","package_names":{"arch":"zsh","default":"zsh","ubuntu":"zsh","void":"zsh"},"slug":"zsh","website":"https://www.zsh.org"}];
const PAGE_SIZE = 10;
let currentPage = 1;
let filtered = PROGRAMS;

function normalize(s) {
  return s ? s.toLowerCase() : "";
}

function search(query) {
  const q = normalize(query.trim());
  if (!q) return PROGRAMS;
  return PROGRAMS.filter(p =>
    normalize(p.name).includes(q) ||
    normalize(p.description).includes(q) ||
    (p.categories || []).some(c => normalize(c).includes(q))
  );
}

function renderPrograms() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);
  const list = document.getElementById("program-list");

  list.innerHTML = page.map(p => `
    <li class="program-item">
      <div class="program-name"><strong>${escHtml(p.name)}</strong></div>
      ${p.description ? `<p class="program-desc">${escHtml(p.description)}</p>` : ""}
      <div class="program-meta">
        ${p.license ? `<span class="badge">${escHtml(p.license)}</span>` : ""}
        ${p.git_repo ? `<a href="${escHtml(p.git_repo)}" target="_blank" rel="noopener" class="badge badge-link">Source</a>` : ""}
        ${p.website ? `<a href="${escHtml(p.website)}" target="_blank" rel="noopener" class="badge badge-link">Website</a>` : ""}
      </div>
    </li>
  `).join("");

  renderPagination();

  const count = document.getElementById("program-count");
  count.textContent = `${filtered.length} program${filtered.length !== 1 ? "s" : ""}`;
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const pag = document.getElementById("pagination");
  if (total <= 1) { pag.innerHTML = ""; return; }

  let html = "";
  if (currentPage > 1)
    html += `<button onclick="goTo(${currentPage - 1})">&#8592; Prev</button>`;

  const range = pageRange(currentPage, total);
  range.forEach(p => {
    if (p === "…")
      html += `<span class="page-ellipsis">…</span>`;
    else
      html += `<button class="${p === currentPage ? "page-active" : ""}" onclick="goTo(${p})">${p}</button>`;
  });

  if (currentPage < total)
    html += `<button onclick="goTo(${currentPage + 1})">Next &#8594;</button>`;

  pag.innerHTML = html;
}

function pageRange(current, total) {
  if (total <= 7) return Array.from({length: total}, (_, i) => i + 1);
  const pages = [1];
  if (current > 3) pages.push("…");
  for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++)
    pages.push(i);
  if (current < total - 2) pages.push("…");
  pages.push(total);
  return pages;
}

function goTo(page) {
  currentPage = page;
  renderPrograms();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

document.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("program-search");
  input.addEventListener("input", () => {
    filtered = search(input.value);
    currentPage = 1;
    renderPrograms();
  });
  renderPrograms();
});
</script>

  <input id="program-search" type="search" placeholder="Search programs…" autocomplete="off">
</div>

<ul id="program-list" class="program-list"></ul>
<div id="pagination" class="pagination"></div>
